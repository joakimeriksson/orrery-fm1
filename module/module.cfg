# ORRERY: strings, lead, bass and drums of the seventies in one module, on the portable meloDock session (see ../README.md)
name = ORRERY
version = 2
sources = ../instruments/electronic_fx.c ../instruments/ensemble.c ../instruments/harmonic.c ../engines/ens_engine.c ../instruments/synthex.c ../instruments/synthex_synth.c ../instruments/synthex_voice.c ../core/session.c ../core/commands.c ../core/mixer.c ../core/effect.c ../core/router.c ../core/instrument.c ../core/transport.c ../instruments/arp.c ../instruments/eminent.c ../instruments/minipops.c ../effects/filter.c ../effects/phaser.c ../effects/echo.c ../effects/reverb.c ../effects/registry.c ../engines/arp_engine.c ../engines/em_engine.c ../engines/mp_engine.c
cflags = -O2 -std=c11 -DMD_SINGLE_CORE -DMD_HOT_SECTION=".ram_text.md"
includes = .. ../engines
# the renders in RAM (core/hot.h): the 16 KiB a module has for code, out of the flash cache's way
cflags ../engines/arp_engine.c = -DARP_HOT=__attribute__((section(".ram_text.arp")))
cflags ../engines/em_engine.c = -DEM_HOT=__attribute__((section(".ram_text.em")))
cflags ../engines/mp_engine.c = -DMP_HOT=__attribute__((section(".ram_text.mp")))
